  <style>
    body { margin: 0; }
    canvas { width: 100vw; height: 100vh; display: block; }

      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;

    <div id="my-id"></div>
